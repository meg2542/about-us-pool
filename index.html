<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070a0d">
  <title>ABOUT US POOL QUEUE</title>
  <style>
    html,body {
      width:100%;
      height:100%;
      margin:0;
      padding:0;
      overflow:hidden;
      background:#070a0d;
    }
    iframe {
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#070a0d;
    }
    #loading {
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      background:#070a0d;
      color:#fff;
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
      z-index:2;
      text-align:center;
    }
    .ball {font-size:48px}
    .title {font-weight:900;margin-top:10px;letter-spacing:1px}
    .sub {color:#94a3b8;font-size:13px;margin-top:6px}
  </style>
</head>
<body>
  <div id="loading">
    <div>
      <div class="ball">🎱</div>
      <div class="title">ABOUT US POOL QUEUE</div>
      <div class="sub">กำลังโหลดระบบคิว…</div>
    </div>
  </div>

  <iframe
    id="poolFrame"
    src="https://script.google.com/macros/s/AKfycbw-9l6vzgGAFh9oNvW4-WwWXzClmexqsFQZnoAcsXewQEBtfG8XcICIRPSw4uN4iSRl/exec"
    title="ABOUT US POOL QUEUE"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="no-referrer">
  </iframe>

  <script>
    const frame = document.getElementById('poolFrame');
    frame.addEventListener('load', function() {
      document.getElementById('loading').style.display = 'none';
    });
    setTimeout(function(){
      document.getElementById('loading').style.display = 'none';
    }, 7000);
  </script>
</body>
  <!-- FORCE UPDATE V1.2 -->
</html>
